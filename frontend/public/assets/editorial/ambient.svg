<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0A0D0B" />
  <rect x="16" y="16" width="568" height="568" fill="none" stroke="rgba(244, 245, 239, 0.1)" stroke-width="1.5" />
  
  <!-- Generative Minimalist Horizon Waves -->
  <g stroke="#C7F43D" stroke-width="1.5" fill="none">
    <path d="M40,240 Q150,180 300,240 T560,240" stroke-opacity="0.3" />
    <path d="M40,280 Q150,210 300,280 T560,280" stroke-opacity="0.6" />
    <path d="M40,320 Q150,240 300,320 T560,320" stroke-opacity="0.9" stroke-width="2" />
    <path d="M40,360 Q150,290 300,360 T560,360" stroke-opacity="0.6" />
    <path d="M40,400 Q150,340 300,400 T560,400" stroke-opacity="0.3" />
  </g>

  <!-- Ambient Orb -->
  <circle cx="300" cy="180" r="32" fill="#141914" stroke="#C7F43D" stroke-width="1.5" />
  <circle cx="300" cy="180" r="10" fill="#C7F43D" />

  <!-- Typography -->
  <text x="40" y="510" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#F4F5EF" letter-spacing="-0.02em">
    AMBIENT &amp; DRONE
  </text>
  <text x="40" y="535" font-family="'JetBrains Mono', monospace" font-size="12" fill="#737A75" letter-spacing="0.1em">
    ISOLATIONIST // MODULAR TONES
  </text>
</svg>
