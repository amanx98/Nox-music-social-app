<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0D0E0D" />
  <rect x="16" y="16" width="568" height="568" fill="none" stroke="rgba(244, 245, 239, 0.12)" stroke-width="1.5" />

  <!-- Industrial Machinery Hatch Pattern -->
  <g stroke="rgba(244, 245, 239, 0.15)" stroke-width="2">
    <line x1="60" y1="120" x2="160" y2="220" />
    <line x1="100" y1="120" x2="200" y2="220" />
    <line x1="140" y1="120" x2="240" y2="220" />
    <line x1="180" y1="120" x2="280" y2="220" />
    <line x1="220" y1="120" x2="320" y2="220" />
    <line x1="260" y1="120" x2="360" y2="220" />
  </g>

  <!-- Heavy Brutalist Hexagon & Crosshairs -->
  <polygon points="300,160 420,230 420,370 300,440 180,370 180,230" fill="#141714" stroke="#C7F43D" stroke-width="3" />
  <line x1="150" y1="300" x2="450" y2="300" stroke="#C7F43D" stroke-width="2" stroke-dasharray="8,4" />
  <line x1="300" y1="130" x2="300" y2="470" stroke="#C7F43D" stroke-width="2" stroke-dasharray="8,4" />
  <circle cx="300" cy="300" r="40" fill="#0A0B0A" stroke="#F4F5EF" stroke-width="2" />
  <rect x="294" y="294" width="12" height="12" fill="#C7F43D" />

  <!-- Typography -->
  <text x="40" y="510" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#F4F5EF" letter-spacing="-0.02em">
    INDUSTRIAL SYNTH
  </text>
  <text x="40" y="535" font-family="'JetBrains Mono', monospace" font-size="12" fill="#737A75" letter-spacing="0.1em">
    EBM // NOISE // CONCRETE GRID
  </text>
</svg>
