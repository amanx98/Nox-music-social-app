<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0E0F0D" />
  <rect x="16" y="16" width="568" height="568" fill="none" stroke="rgba(244, 245, 239, 0.12)" stroke-width="1.5" />

  <!-- Cassette Tape Window & Spools -->
  <g transform="translate(100, 160)">
    <rect width="400" height="220" rx="6" fill="#151714" stroke="#737A75" stroke-width="2" />
    <rect x="30" y="30" width="340" height="160" rx="4" fill="#0A0B0A" stroke="rgba(244, 245, 239, 0.2)" stroke-width="1" />
    
    <!-- Transparent Center Window -->
    <rect x="80" y="55" width="240" height="110" rx="3" fill="#181B17" stroke="#737A75" stroke-width="1.5" />
    
    <!-- Left Reel (Fuller Tape) -->
    <circle cx="140" cy="110" r="38" fill="#20251F" stroke="#F4F5EF" stroke-width="1.5" />
    <circle cx="140" cy="110" r="16" fill="#0A0B0A" stroke="#C7F43D" stroke-width="2" />
    <circle cx="140" cy="110" r="6" fill="#C7F43D" />

    <!-- Right Reel (Less Tape) -->
    <circle cx="260" cy="110" r="28" fill="#1B1E1A" stroke="#F4F5EF" stroke-width="1.5" />
    <circle cx="260" cy="110" r="16" fill="#0A0B0A" stroke="#C7F43D" stroke-width="2" />
    <circle cx="260" cy="110" r="6" fill="#C7F43D" />

    <!-- Magnetic Ribbon Bridge -->
    <line x1="140" y1="148" x2="260" y2="138" stroke="#C7F43D" stroke-width="2.5" />
  </g>

  <!-- Typography -->
  <text x="40" y="510" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#F4F5EF" letter-spacing="-0.02em">
    LO-FI TAPE &amp; DUB
  </text>
  <text x="40" y="535" font-family="'JetBrains Mono', monospace" font-size="12" fill="#737A75" letter-spacing="0.1em">
    MAGNETIC SATURATION // C-60
  </text>
</svg>
